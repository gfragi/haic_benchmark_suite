server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the backend Service in the same namespace, so this
  # pod is self-sufficient for testing (e.g. via port-forward) without an
  # Ingress in front of it. Harmless once Ingress is wired up - it just
  # intercepts /api and /meta before they reach here.
  #
  # Uses the cluster DNS resolver (NGINX_LOCAL_RESOLVERS, populated from
  # /etc/resolv.conf by the official nginx image's entrypoint - see
  # NGINX_ENTRYPOINT_LOCAL_RESOLVERS in the Dockerfile - works regardless of
  # distro/DNS addon name) + a variable in proxy_pass so the backend host is
  # resolved lazily per-request instead of once at nginx startup. A static
  # proxy_pass hostname (e.g. "proxy_pass http://backend:8000/api/;") makes
  # nginx hard-fail to start if the backend Service isn't resolvable yet at
  # boot - this avoids that startup-ordering trap. This file is processed as
  # an envsubst template (see Dockerfile), hence ${NGINX_LOCAL_RESOLVERS}.
  #
  # The backend host below must be fully-qualified (backend.<ns>.svc.cluster.local),
  # not the short name "backend" - nginx's resolver directive does a raw DNS
  # query and, unlike the OS-level resolver, does not apply /etc/resolv.conf's
  # search-domain suffixes, so the short name fails with "could not be resolved".
  #
  # proxy_pass here has NO URI part (just the variable, no trailing path) -
  # when proxy_pass uses a variable AND a URI suffix (e.g. "$var/meta/"),
  # nginx does not append the request's unmatched remainder, so "/meta/health"
  # would be forwarded as bare "/meta/". Omitting the URI part makes nginx
  # pass the original request URI through unchanged, which is what backend's
  # routes expect (they're registered under the same full paths, e.g. /meta/health).
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

  location /api/ {
    set $backend_upstream http://backend.benchmarking.svc.cluster.local:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /meta/ {
    set $backend_upstream http://backend.benchmarking.svc.cluster.local:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
    expires 6M;
    access_log off;
    add_header Cache-Control "public";
  }

  error_page 404 /index.html;
}
