apiVersion: v1
kind: Secret
metadata:
  name: haic-benchmark-secret
  namespace: haic-benchmark
type: Opaque
stringData:
  # Database credentials
  DB_NAME: haic_benchmark
  DB_USER: haic_user
  DB_PASSWORD: "testLive"  # CHANGE THIS

  # Full database connection string for backend
  DATABASE_URL: "postgresql://haic_user:testLive@postgres.haic-benchmark.svc.cluster.local:5432/haic_benchmark"

  # MinIO (external) - update with your actual endpoint
  MINIO_ENDPOINT: "s3-minio.humaine-horizon.eu"
  MINIO_SECURE: "true"
  MINIO_REGION: "us-east-1"
  MINIO_USERNAME: "benchmarking-suite-service"
  MINIO_PASSWORD: "benchmark1ng-su1te-hum4ine!"  # CHANGE THIS
  MINIO_BUCKET: "benchmarking-suite"

  # Backend auth/API
  AUTH_URL: "https://humaine-minio-api.euprojects.net/auth/auth"  # CHANGE THIS
---
apiVersion: v1
kind: Secret
metadata:
  name: haic-frontend-secret
  namespace: haic-benchmark
type: Opaque
stringData:
  # Frontend configuration
  VUE_APP_API_BASE_URL: "https://benchmark.humaine-horizon.eu/api/"  # Change to your backend URL
  VUE_APP_KEYCLOAK_URL: "https://keycloak.humaine-horizon.eu/"  # CHANGE THIS
  VUE_APP_KEYCLOAK_REALM: "humaine"  # CHANGE THIS
  VUE_APP_KEYCLOAK_CLIENT_ID: "benchmarking-suite"  # CHANGE THIS
  VITE_SURVEY_ENDPOINT: "https://benchmark.humaine-horizon.eu/api/v1/survey"

