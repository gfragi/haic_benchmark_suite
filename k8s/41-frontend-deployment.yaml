apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: benchmarking
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/gfragi/haic-frontend-react:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            # Used by nginx.conf (envsubst template) to build the backend's
            # fully-qualified DNS name for this namespace - makes the image
            # portable across namespaces/clusters instead of hardcoding one.
            # NOTE: VITE_KEYCLOAK_*/API base URL are NOT runtime env vars for
            # this image - Vite bakes them into the static JS bundle at
            # `docker build` time (from frontend-react/.env.production), so
            # setting them here would have no effect. See k8s/README.md.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
