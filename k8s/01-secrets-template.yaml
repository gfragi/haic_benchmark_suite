# Template for creating secrets. Copy this file to 01-secrets.yaml and fill in actual values
# DO NOT commit 01-secrets.yaml to git - add it to .gitignore
apiVersion: v1
kind: Secret
metadata:
  name: benchmarking-secret
  namespace: benchmarking
type: Opaque
stringData:
  # Database credentials
  DB_NAME: haic_benchmark
  DB_USER: haic_user
  DB_PASSWORD: "changeme123"  # CHANGE THIS

  # Full database connection string for backend
  DATABASE_URL: "postgresql://haic_user:changeme123@postgres.benchmarking.svc.cluster.local:5432/haic_benchmark"

  # MinIO (external) - update with your actual endpoint
  MINIO_ENDPOINT: "minio.example.com:9000"
  MINIO_SECURE: "true"
  MINIO_REGION: "us-east-1"
  MINIO_USERNAME: "minioadmin"       # access key, unless using AUTH_URL below
  MINIO_PASSWORD: "minioadmin"       # secret key, unless using AUTH_URL below - CHANGE THIS
  MINIO_BUCKET: "haic-benchmark"

  # 31-backend-deployment.yaml references this key without `optional: true`, so
  # it MUST exist in the secret even if you don't use it - the pod fails
  # CreateContainerConfigError otherwise. Leave it as an empty string to use
  # plain MINIO_USERNAME/MINIO_PASSWORD access-key auth above (most standalone
  # MinIO/S3 setups). Only fill it in if your MinIO/S3 sits behind a
  # Keycloak-style OAuth token exchange (HUA's shared MinIO does).
  AUTH_URL: ""

# NOTE: there is no separate frontend Secret. The React frontend (frontend-react/)
# bakes its Keycloak client id/realm/URL into the JS bundle at Docker BUILD TIME
# from frontend-react/.env.production - a runtime k8s Secret has no effect on it.
# To deploy into a different environment, edit frontend-react/.env.production with
# that environment's Keycloak values and rebuild the frontend image before applying
# 41-frontend-deployment.yaml.
#
# Also note: the backend API itself has no authentication - Keycloak only gates
# the frontend UI. Anything that can reach the backend Service can call it
# directly. Restrict network exposure accordingly if that's not acceptable for
# your cluster.
